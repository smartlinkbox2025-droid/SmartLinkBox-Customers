م.تيسير`;const OLD=['WhatsApp Image 2026-09-06 at 2.41.50 PM.jpeg','WhatsApp Image 2026-09-06 at 2.41.51 PM.jpeg','WhatsApp Image 2026-09-06 at 2.41.51 PM (1).jpeg'];let CUSTOM=JSON.parse(localStorage.slbCustomers||'[]'),EDITS=JSON.parse(localStorage.slbEdits||'{}'),DELETED=new Set(JSON.parse(localStorage.slbDeleted||'[]')),S=new Set(JSON.parse(localStorage.slb||'[]')),PRODUCTS=[];const DB='slbMediaDB';brand.value=localStorage.slbBrand||'SmartLinkBox';msg.value=localStorage.slbMessage||DEFAULT;function updateBrand(){let b=localStorage.slbBrand||'SmartLinkBox';brandHead.textContent=b;brandSub.textContent=b;document.title=b+' | إدارة العملاء'}updateBrand();function saveBrand(){let b=brand.value.trim();if(!b)return;localStorage.slbBrand=b;updateBrand();brandok.textContent='تم حفظ اسم النشاط.'}function all(){return BASE.filter(x=>!DELETED.has(x[0])).map(x=>EDITS[x[0]]||x).concat(CUSTOM.filter(x=>!DELETED.has(x[0])))}function currentMsg(){return msg.value.trim()||DEFAULT}function saveMsg(){localStorage.slbMessage=msg.value;ok.textContent='تم حفظ الرسالة.'}function resetMsg(){msg.value=DEFAULT;localStorage.slbMessage=DEFAULT;ok.textContent='تمت استعادة الرسالة الأصلية.'}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('images'))e.target.result.createObjectStore('images',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function loadImages(){let db=await openDB(),tx=db.transaction('images','readonly'),rq=tx.objectStore('images').getAll();rq.onsuccess=()=>{PRODUCTS=rq.result;renderImages()}}async function addImages(){let fs=[...imgInput.files];if(!fs.length){imgok.textContent='اختر صورة واحدة على الأقل.';return}let db=await openDB();for(let f of fs){if(!f.type.startsWith('image/'))continue;let tx=db.transaction('images','readwrite');tx.objectStore('images').add({name:f.name,type:f.type,blob:f});await new Promise(r=>tx.oncomplete=r)}imgInput.value='';imgok.textContent='تم رفع الصور وحفظها.';loadImages()}async function deleteImage(id){let db=await openDB(),tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);tx.oncomplete=()=>loadImages()}async function clearImages(){if(!confirm('حذف جميع الصور المرفوعة؟'))return;let db=await openDB(),tx=db.transaction('images','readwrite');tx.objectStore('images').clear();tx.oncomplete=()=>{PRODUCTS=[];renderImages()}}function renderImages(){imgs.innerHTML=PRODUCTS.length?PRODUCTS.map(x=>`<div class=pic><img src="${URL.createObjectURL(x.blob)}"><div class=m>${esc(x.name)}</div><button class=del onclick="deleteImage(${x.id})">حذف الصورة</button></div>`).join(''):'<div class=m>لا توجد صور مرفوعة. عند المشاركة ستستخدم الصور الأصلية.</div>'}async function shareAll(){saveMsg();try{let files=[];if(PRODUCTS.length)files=PRODUCTS.map((x,i)=>new File([x.blob],x.name||`product-${i+1}.jpg`,{type:x.type||'image/jpeg'}));else for(let i=0;i<OLD.length;i++){let b=await fetch(OLD[i]).then(r=>r.blob());files.push(new File([b],`product-${i+1}.jpg`,{type:'image/jpeg'}))}if(navigator.share&&(!navigator.canShare||navigator.canShare({files})))await navigator.share({files,text:currentMsg(),title:localStorage.slbBrand||'SmartLinkBox'});else alert('استخدم Chrome على الجوال لمشاركة الصور مباشرة.')}catch(e){if(e.name!=='AbortError')alert('تعذرت المشاركة.')}}function normalizePhone(v){let n=String(v||'').replace(/\D/g,'');if(n.startsWith('00966'))n=n.slice(2);if(n.startsWith('9660'))n='966'+n.slice(4);if(n.startsWith('966'))return n;if(n.startsWith('0'))return'966'+n.slice(1);if(n.length===9&&n.startsWith('5'))return'966'+n;return n}function findDuplicate(phone,excludeId=null){let n=normalizePhone(phone);return all().find(x=>x[0]!==excludeId&&normalizePhone(x[2])===n)}function wa(x){open('https://wa.me/'+normalizePhone(x[2])+'?text='+encodeURIComponent(currentMsg()),'_blank')}function dupHTML(x){return `<div class=n>⚠️ هذا العميل موجود بالفعل</div><div class=m><b>${esc(x[1])}</b><br>الجوال: ${esc(x[2])}<br>الفئة: ${esc(x[5])}<br>العنوان: ${esc(x[4])}<br>الأولوية: ${esc(x[3])}<br>حالة التواصل: ${S.has(x[0])?'تم التواصل':'لم يتم التواصل'}${x[6]?'<br>جهة الاتصال: '+esc(x[6]):''}${x[7]?'<br>الملاحظات: '+esc(x[7]):''}</div><div class=actions><button class=blue onclick="showCustomer(${x[0]})">عرض العميل</button><button class=wa onclick="waById(${x[0]})">فتح واتساب</button></div>`}function waById(id){let x=all().find(a=>a[0]===id);if(x)wa(x)}function showCustomer(id){q.value='';p.value='';r();setTimeout(()=>{let el=document.getElementById('customer-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),2200)}},50)}function addCustomer(){dup.classList.remove('show');let name=cn.value.trim(),phone=cp.value.trim(),address=ca.value.trim();if(!name||!phone||!address){addok.textContent='يرجى إدخال اسم العميل ورقم الجوال والعنوان.';return}if(normalizePhone(phone).length<12){addok.textContent='رقم الجوال غير صحيح.';return}let d=findDuplicate(phone);if(d){addok.textContent='لم تتم الإضافة لأن رقم الجوال مسجل مسبقًا.';dup.innerHTML=dupHTML(d);dup.classList.add('show');return}let ids=BASE.concat(CUSTOM).map(x=>x[0]),id=Math.max(...ids,66)+1;CUSTOM.push([id,name,phone,cpr.value,address,cc.value.trim()||'غير محدد',ct.value.trim(),cnotes.value.trim()]);localStorage.slbCustomers=JSON.stringify(CUSTOM);cn.value=cp.value=cc.value=ca.value=ct.value=cnotes.value='';addok.textContent='تمت إضافة العميل.';r()}function editCustomer(id){let x=all().find(a=>a[0]===id);if(!x)return;eid.value=id;en.value=x[1];ep.value=x[2];epr.value=x[3];ea.value=x[4];ec.value=x[5];et.value=x[6]||'';enotes.value=x[7]||'';editok.textContent='';editModal.classList.add('show')}function closeEdit(){editModal.classList.remove('show')}function saveEdit(){let id=Number(eid.value),name=en.value.trim(),phone=ep.value.trim(),address=ea.value.trim();if(!name||!phone||!address){editok.textContent='يرجى إدخال الاسم ورقم الجوال والعنوان.';return}if(normalizePhone(phone).length<12){editok.textContent='رقم الجوال غير صحيح.';return}let d=findDuplicate(phone,id);if(d){editok.textContent='لا يمكن الحفظ: هذا الرقم مسجل للعميل «'+d[1]+'» (#'+d[0]+').';return}let x=[id,name,phone,epr.value,address,ec.value.trim()||'غير محدد',et.value.trim(),enotes.value.trim()];if(id<=66){EDITS[id]=x;localStorage.slbEdits=JSON.stringify(EDITS)}else{let i=CUSTOM.findIndex(a=>a[0]===id);if(i>=0){CUSTOM[i]=x;localStorage.slbCustomers=JSON.stringify(CUSTOM)}}closeEdit();r();showCustomer(id)}function deleteCustomer(id,name){if(!confirm('هل تريد حذف العميل «'+name+'»؟'))return;if(id>66){CUSTOM=CUSTOM.filter(x=>x[0]!==id);localStorage.slbCustomers=JSON.stringify(CUSTOM)}else{DELETED.add(id);localStorage.slbDeleted=JSON.stringify([...DELETED])}S.delete(id);localStorage.slb=JSON.stringify([...S]);r()}function done(n){S.has(n)?S.delete(n):S.add(n);localStorage.slb=JSON.stringify([...S]);r()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function exportExcel(type){try{if(typeof ExcelJS==='undefined'){excelok.textContent='تعذر تحميل أداة Excel. تأكد من اتصال الإنترنت.';return}let data=all().filter(x=>type==='all'||(type==='contacted'?S.has(x[0]):!S.has(x[0]))),brandName=localStorage.slbBrand||'SmartLinkBox',label=type==='all'?'جميع العملاء':type==='contacted'?'تم التواصل معهم':'لم يتم التواصل معهم';if(!data.length){excelok.textContent='لا يوجد عملاء ضمن المجموعة المختارة.';return}let wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('العملاء',{views:[{rightToLeft:true,state:'frozen',ySplit:4}]});ws.mergeCells('A1:I1');let t=ws.getCell('A1');t.value=brandName+' | تقرير العملاء';t.font={bold:true,size:18,color:{argb:'FFFFFFFF'}};t.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF075A91'}};t.alignment={horizontal:'center'};ws.mergeCells('A2:I2');ws.getCell('A2').value='نوع التقرير: '+label+' | العدد: '+data.length+' | '+new Date().toLocaleDateString('ar-SA');let headers=['الترتيب','اسم العميل / المحل','رقم الجوال','الفئة','الحي / العنوان','الأولوية','جهة الاتصال','حالة التواصل','ملاحظات المتابعة'];headers.forEach((h,i)=>{let c=ws.getRow(4).getCell(i+1);c.value=h;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF167C45'}}});data.forEach((x,i)=>ws.addRow([i+1,x[1],x[2],x[5],x[4],x[3],x[6]||'',S.has(x[0])?'تم التواصل':'لم يتم التواصل',x[7]||'']));ws.columns=[{width:10},{width:34},{width:18},{width:18},{width:30},{width:12},{width:24},{width:20},{width:40}];ws.autoFilter={from:'A4',to:'I4'};ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1};let buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=brandName.replace(/[\\/:*?"<>|]/g,'-')+' - '+label+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);excelok.textContent='تم إنشاء ملف Excel: '+label+' ('+data.length+' عميل).'}catch(e){console.error(e);excelok.textContent='تعذر إنشاء ملف Excel على هذا الجهاز.'}}function r(){let A=all(),z=q.value.toLowerCase(),pp=p.value,a=A.filter(x=>(!pp||x[3]===pp)&&(!z||(x.slice(1).join(' ')).toLowerCase().includes(z)));s.innerHTML=`العملاء: <b>${A.length}</b> | المعروض: <b>${a.length}</b> | تم التواصل: <b>${A.filter(x=>S.has(x[0])).length}</b>`;l.innerHTML=a.map(x=>`<div id="customer-${x[0]}" class="c ${x[3]} ${S.has(x[0])?'sent':''}"><div class=n>#${x[0]} ${esc(x[1])}</div><div class=m>${esc(x[5])} — ${esc(x[4])} — ${esc(x[2])} — <span class=tag>أولوية ${esc(x[3])}</span></div>${x[6]?`<div class=m>جهة الاتصال: ${esc(x[6])}</div>`:''}${x[7]?`<div class=m>ملاحظات: ${esc(x[7])}</div>`:''}<div class=actions><button class=wa onclick="waById(${x[0]})">فتح واتساب للعميل</button><button class=done onclick="done(${x[0]})">${S.has(x[0])?'إلغاء تم التواصل':'تم التواصل'}</button><button class=edit onclick="editCustomer(${x[0]})">تعديل</button><button class=del onclick='deleteCustomer(${x[0]},${JSON.stringify(x[1])})'>حذف</button></div></div>`).join('')}q.oninput=p.onchange=r;loadImages();r()</script></body></html>
